name: gate

# Trusted gate. The workflow definition, policy and scripts always come from the
# default branch: pull_request_target uses the base-branch workflow file, and the
# candidate tree is never checked out into the workspace. Candidate code only runs
# inside temporary `git archive` exports, in a job whose token is contents:read.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact candidate commit SHA (40 hex)
        required: true
      pr_number:
        description: PR number to fetch the candidate from (needed for fork PRs)
        required: false

permissions: {}

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || inputs.candidate_sha }}
  PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
  POLICY_SHA: ${{ github.sha }}

jobs:
  policy:
    name: policy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch candidate objects (not checked out)
        env:
          TOKEN: ${{ github.token }}
        run: bash .agent-workflow/scripts/ci_fetch_candidate.sh
      - name: Static policy check (trusted policy from main)
        run: |
          python3 .agent-workflow/scripts/check_policy.py --mode gate --repo . \
            --policy .agent-workflow/policy/policy.json \
            --approvals .agent-workflow/approvals/approvals.json \
            --base "$BASE_SHA" --head "$CANDIDATE_SHA" \
            --out "$RUNNER_TEMP/policy-result.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: policy-result
          path: ${{ runner.temp }}/policy-result.json
          if-no-files-found: ignore

  tests:
    name: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch candidate objects (not checked out)
        env:
          TOKEN: ${{ github.token }}
        run: bash .agent-workflow/scripts/ci_fetch_candidate.sh
      - name: Self-check - this job's token must not be able to write a commit status
        env:
          TOKEN: ${{ github.token }}
        run: |
          code=$(curl -s -o "$RUNNER_TEMP/forge.json" -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$CANDIDATE_SHA" \
            -d '{"state":"success","context":"trusted-gate","description":"forged from low-privilege job"}')
          echo "forge_status_http=$code"; cat "$RUNNER_TEMP/forge.json"; echo
          if [ "$code" = "201" ]; then echo "::error::low-privilege token was able to write a status"; exit 1; fi
      - name: BASE code + HEAD tests, then HEAD (ephemeral exports, no token in env)
        run: |
          python3 .agent-workflow/scripts/base_head.py --repo . \
            --base "$BASE_SHA" --head "$CANDIDATE_SHA" \
            --plan .agent-workflow/policy/test-plan.json --runs 3 \
            --out "$RUNNER_TEMP/basehead-result.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: basehead-result
          path: ${{ runner.temp }}/basehead-result.json
          if-no-files-found: ignore

  trusted-gate:
    name: trusted-gate
    runs-on: ubuntu-latest
    needs: [policy, tests]
    if: always()
    permissions: {}
    steps:
      - name: Verdict and receipt
        env:
          POLICY_RESULT: ${{ needs.policy.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
        run: |
          printf '{"gate":"trusted-gate","candidate_sha":"%s","policy_sha":"%s","workflow_sha":"%s","workflow_ref":"%s","event":"%s","ref":"%s","run_id":"%s","run_attempt":"%s","policy":"%s","tests":"%s"}\n' \
            "$CANDIDATE_SHA" "$POLICY_SHA" "$GITHUB_WORKFLOW_SHA" "$GITHUB_WORKFLOW_REF" "$GITHUB_EVENT_NAME" \
            "$GITHUB_REF" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$POLICY_RESULT" "$TESTS_RESULT" \
            | tee "$RUNNER_TEMP/gate-receipt.json"
          [ "$GITHUB_REF" = "refs/heads/main" ] || { echo "::error::not running from main"; exit 1; }
          [ "$POLICY_RESULT" = "success" ] && [ "$TESTS_RESULT" = "success" ]
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-receipt
          path: ${{ runner.temp }}/gate-receipt.json
